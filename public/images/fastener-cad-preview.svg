<svg width="96" height="64" viewBox="0 0 96 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="96" height="64" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#dee2e6" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="96" height="64" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="48" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#495057">BOLT ASSEMBLY</text>
  
  <!-- Bolt assembly drawing -->
  <g stroke="#343a40" stroke-width="1.5" fill="none">
    <!-- Bolt head (hex) -->
    <polygon points="38,20 42,18 54,18 58,20 58,26 54,28 42,28 38,26" stroke-width="1.5"/>
    
    <!-- Bolt shank -->
    <rect x="45" y="28" width="6" height="25"/>
    
    <!-- Thread representation -->
    <g stroke="#6c757d" stroke-width="0.8">
      <line x1="45" y1="30" x2="51" y2="30"/>
      <line x1="45" y1="32" x2="51" y2="32"/>
      <line x1="45" y1="34" x2="51" y2="34"/>
      <line x1="45" y1="36" x2="51" y2="36"/>
      <line x1="45" y1="38" x2="51" y2="38"/>
      <line x1="45" y1="40" x2="51" y2="40"/>
      <line x1="45" y1="42" x2="51" y2="42"/>
      <line x1="45" y1="44" x2="51" y2="44"/>
      <line x1="45" y1="46" x2="51" y2="46"/>
      <line x1="45" y1="48" x2="51" y2="48"/>
      <line x1="45" y1="50" x2="51" y2="50"/>
      <line x1="45" y1="52" x2="51" y2="52"/>
    </g>
    
    <!-- Nut -->
    <polygon points="42,45 46,43 50,43 54,45 54,51 50,53 46,53 42,51" stroke-width="1.5"/>
    
    <!-- Washer -->
    <ellipse cx="48" cy="40" rx="6" ry="1.5" stroke-width="1"/>
    
    <!-- Dimension lines -->
    <g stroke="#007bff" stroke-width="0.8">
      <!-- Length dimension -->
      <line x1="60" y1="18" x2="60" y2="53"/>
      <line x1="58" y1="18" x2="62" y2="18"/>
      <line x1="58" y1="53" x2="62" y2="53"/>
      <text x="64" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#007bff" transform="rotate(90, 64, 36)">80mm</text>
      
      <!-- Diameter dimension -->
      <line x1="30" y1="48" x2="66" y2="48"/>
      <line x1="30" y1="46" x2="30" y2="50"/>
      <line x1="66" y1="46" x2="66" y2="50"/>
      <text x="48" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#007bff">M12</text>
    </g>
  </g>
  
  <!-- Specifications -->
  <text x="4" y="60" font-family="Arial, sans-serif" font-size="5" fill="#6c757d">Grade: 8.8 | Material: Alloy Steel</text>
</svg>