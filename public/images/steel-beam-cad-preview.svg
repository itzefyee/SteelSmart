<svg width="96" height="64" viewBox="0 0 96 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="96" height="64" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#dee2e6" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="96" height="64" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="48" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#495057">I-BEAM SECTION</text>
  
  <!-- I-beam cross-section -->
  <g stroke="#343a40" stroke-width="1.5" fill="none">
    <!-- Top flange -->
    <rect x="25" y="20" width="46" height="6"/>
    
    <!-- Web -->
    <rect x="45" y="20" width="6" height="28"/>
    
    <!-- Bottom flange -->
    <rect x="25" y="42" width="46" height="6"/>
    
    <!-- Center lines -->
    <g stroke="#dc3545" stroke-width="0.8" stroke-dasharray="2,2">
      <line x1="48" y1="16" x2="48" y2="52"/>
      <line x1="20" y1="31" x2="76" y2="31"/>
    </g>
    
    <!-- Dimension lines -->
    <g stroke="#007bff" stroke-width="0.8">
      <!-- Width dimension -->
      <line x1="25" y1="16" x2="71" y2="16"/>
      <line x1="25" y1="14" x2="25" y2="18"/>
      <line x1="71" y1="14" x2="71" y2="18"/>
      <text x="48" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#007bff">200mm</text>
      
      <!-- Height dimension -->
      <line x1="76" y1="20" x2="76" y2="48"/>
      <line x1="74" y1="20" x2="78" y2="20"/>
      <line x1="74" y1="48" x2="78" y2="48"/>
      <text x="80" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#007bff" transform="rotate(90, 80, 34)">100mm</text>
      
      <!-- Web thickness -->
      <line x1="45" y1="55" x2="51" y2="55"/>
      <line x1="45" y1="53" x2="45" y2="57"/>
      <line x1="51" y1="53" x2="51" y2="57"/>
      <text x="48" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#007bff">6mm</text>
    </g>
  </g>
  
  <!-- Cross-section indicator -->
  <text x="18" y="31" font-family="Arial, sans-serif" font-size="6" fill="#dc3545">A</text>
  <text x="78" y="31" font-family="Arial, sans-serif" font-size="6" fill="#dc3545">A</text>
</svg>