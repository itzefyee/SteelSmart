<svg width="96" height="64" viewBox="0 0 96 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="96" height="64" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#dee2e6" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="96" height="64" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="48" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#495057">BRACKET DRAWING</text>
  
  <!-- Main bracket shape -->
  <g stroke="#343a40" stroke-width="1.5" fill="none">
    <!-- Base plate -->
    <rect x="20" y="35" width="56" height="20" rx="2"/>
    
    <!-- Vertical support -->
    <rect x="44" y="18" width="8" height="17"/>
    
    <!-- Mounting holes -->
    <circle cx="28" cy="45" r="2" fill="#6c757d"/>
    <circle cx="68" cy="45" r="2" fill="#6c757d"/>
    <circle cx="48" cy="25" r="1.5" fill="#6c757d"/>
    
    <!-- Dimension lines -->
    <g stroke="#007bff" stroke-width="0.8">
      <!-- Length dimension -->
      <line x1="20" y1="30" x2="76" y2="30"/>
      <line x1="20" y1="28" x2="20" y2="32"/>
      <line x1="76" y1="28" x2="76" y2="32"/>
      <text x="48" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#007bff">56mm</text>
      
      <!-- Height dimension -->
      <line x1="82" y1="18" x2="82" y2="55"/>
      <line x1="80" y1="18" x2="84" y2="18"/>
      <line x1="80" y1="55" x2="84" y2="55"/>
      <text x="86" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#007bff" transform="rotate(90, 86, 37)">37mm</text>
    </g>
  </g>
  
  <!-- Specifications -->
  <text x="4" y="60" font-family="Arial, sans-serif" font-size="5" fill="#6c757d">Material: Steel | Tolerance: ±0.1mm</text>
</svg>