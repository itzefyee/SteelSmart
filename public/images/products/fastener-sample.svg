<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fastener Set Realistic Representation -->
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nutGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
    <filter id="fastenerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" fill="#374151" font-size="16" font-weight="bold" font-family="Arial">Grade 8 Hex Bolt Assembly</text>
  
  <!-- Hex Bolt -->
  <g transform="translate(80, 80)">
    <!-- Bolt Head (Hexagon) -->
    <polygon points="20,10 35,18 35,34 20,42 5,34 5,18" fill="url(#boltGradient)" stroke="#92400e" stroke-width="1" filter="url(#fastenerShadow)"/>
    
    <!-- Bolt Shaft -->
    <rect x="15" y="42" width="10" height="80" fill="url(#boltGradient)" stroke="#92400e" stroke-width="1"/>
    
    <!-- Thread Lines -->
    <g stroke="#92400e" stroke-width="0.5">
      <line x1="13" y1="50" x2="27" y2="50"/>
      <line x1="13" y1="58" x2="27" y2="58"/>
      <line x1="13" y1="66" x2="27" y2="66"/>
      <line x1="13" y1="74" x2="27" y2="74"/>
      <line x1="13" y1="82" x2="27" y2="82"/>
      <line x1="13" y1="90" x2="27" y2="90"/>
      <line x1="13" y1="98" x2="27" y2="98"/>
      <line x1="13" y1="106" x2="27" y2="106"/>
      <line x1="13" y1="114" x2="27" y2="114"/>
    </g>
    
    <!-- Label -->
    <text x="20" y="140" text-anchor="middle" fill="#374151" font-size="10" font-family="Arial">M12 x 80mm</text>
    <text x="20" y="152" text-anchor="middle" fill="#6b7280" font-size="8" font-family="Arial">Grade 8</text>
  </g>
  
  <!-- Hex Nut -->
  <g transform="translate(200, 100)">
    <!-- Nut (Hexagon) -->
    <polygon points="20,5 30,11 30,21 20,27 10,21 10,11" fill="url(#nutGradient)" stroke="#6b7280" stroke-width="1" filter="url(#fastenerShadow)"/>
    
    <!-- Center Hole -->
    <circle cx="20" cy="16" r="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    
    <!-- Label -->
    <text x="20" y="45" text-anchor="middle" fill="#374151" font-size="10" font-family="Arial">M12 Hex Nut</text>
    <text x="20" y="57" text-anchor="middle" fill="#6b7280" font-size="8" font-family="Arial">Grade 2</text>
  </g>
  
  <!-- Flat Washer -->
  <g transform="translate(320, 105)">
    <!-- Washer -->
    <circle cx="15" cy="15" r="12" fill="url(#nutGradient)" stroke="#6b7280" stroke-width="1" filter="url(#fastenerShadow)"/>
    
    <!-- Center Hole -->
    <circle cx="15" cy="15" r="5" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    
    <!-- Label -->
    <text x="15" y="45" text-anchor="middle" fill="#374151" font-size="10" font-family="Arial">12mm Washer</text>
    <text x="15" y="57" text-anchor="middle" fill="#6b7280" font-size="8" font-family="Arial">USS</text>
  </g>
  
  <!-- Assembly Illustration -->
  <g transform="translate(120, 180)">
    <text x="80" y="10" text-anchor="middle" fill="#374151" font-size="12" font-weight="bold" font-family="Arial">Assembly Order</text>
    
    <!-- Assembly sequence -->
    <circle cx="20" cy="30" r="8" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
    <text x="20" y="35" text-anchor="middle" fill="white" font-size="10" font-family="Arial">1</text>
    <text x="50" y="35" fill="#6b7280" font-size="9" font-family="Arial">Bolt Head</text>
    
    <circle cx="20" cy="50" r="8" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
    <text x="20" y="55" text-anchor="middle" fill="white" font-size="10" font-family="Arial">2</text>
    <text x="50" y="55" fill="#6b7280" font-size="9" font-family="Arial">Flat Washer</text>
    
    <circle cx="20" cy="70" r="8" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
    <text x="20" y="75" text-anchor="middle" fill="white" font-size="10" font-family="Arial">3</text>
    <text x="50" y="75" fill="#6b7280" font-size="9" font-family="Arial">Through Material</text>
    
    <circle cx="120" cy="50" r="8" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
    <text x="120" y="55" text-anchor="middle" fill="white" font-size="10" font-family="Arial">4</text>
    <text x="150" y="55" fill="#6b7280" font-size="9" font-family="Arial">Hex Nut</text>
  </g>
  
  <!-- Specifications -->
  <text x="20" y="260" fill="#6b7280" font-size="9" font-family="Arial">• Material: Alloy Steel, Zinc Plated</text>
  <text x="20" y="275" fill="#6b7280" font-size="9" font-family="Arial">• Tensile Strength: 150,000 PSI minimum</text>
  <text x="20" y="290" fill="#6b7280" font-size="9" font-family="Arial">• Thread Pitch: 1.75mm (Metric Coarse)</text>
</svg>