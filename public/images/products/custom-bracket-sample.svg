<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Custom Bracket Realistic Representation -->
  <defs>
    <linearGradient id="bracketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="bracketShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="dimArrow" markerWidth="8" markerHeight="6" 
     refX="0" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" fill="#374151" font-size="16" font-weight="bold" font-family="Arial">Custom L-Bracket - Stainless Steel</text>
  
  <!-- Main Bracket Structure -->
  <g transform="translate(100, 60)">
    <!-- Vertical Section -->
    <rect x="0" y="0" width="15" height="120" fill="url(#bracketGradient)" stroke="#5b21b6" stroke-width="2" filter="url(#bracketShadow)"/>
    
    <!-- Horizontal Section -->
    <rect x="0" y="105" width="150" height="15" fill="url(#bracketGradient)" stroke="#5b21b6" stroke-width="2" filter="url(#bracketShadow)"/>
    
    <!-- Mounting Holes -->
    <circle cx="7.5" cy="20" r="4" fill="none" stroke="#5b21b6" stroke-width="2"/>
    <circle cx="7.5" cy="50" r="4" fill="none" stroke="#5b21b6" stroke-width="2"/>
    <circle cx="7.5" cy="80" r="4" fill="none" stroke="#5b21b6" stroke-width="2"/>
    
    <circle cx="30" cy="112.5" r="4" fill="none" stroke="#5b21b6" stroke-width="2"/>
    <circle cx="60" cy="112.5" r="4" fill="none" stroke="#5b21b6" stroke-width="2"/>
    <circle cx="90" cy="112.5" r="4" fill="none" stroke="#5b21b6" stroke-width="2"/>
    <circle cx="120" cy="112.5" r="4" fill="none" stroke="#5b21b6" stroke-width="2"/>
    
    <!-- Dimension Lines -->
    <!-- Height dimension -->
    <line x1="-15" y1="0" x2="-15" y2="120" stroke="#ef4444" stroke-width="1" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="-25" y="65" text-anchor="middle" fill="#ef4444" font-size="10" font-family="Arial" transform="rotate(-90 -25 65)">120mm</text>
    
    <!-- Width dimension -->
    <line x1="0" y1="-15" x2="150" y2="-15" stroke="#ef4444" stroke-width="1" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="75" y="-20" text-anchor="middle" fill="#ef4444" font-size="10" font-family="Arial">150mm</text>
    
    <!-- Thickness dimension -->
    <line x1="165" y1="105" x2="165" y2="120" stroke="#ef4444" stroke-width="1" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="175" y="115" fill="#ef4444" font-size="10" font-family="Arial">15mm</text>
  </g>
  
  <!-- Material Specification Box -->
  <rect x="280" y="80" width="100" height="60" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="330" y="95" text-anchor="middle" fill="#374151" font-size="10" font-weight="bold" font-family="Arial">Material Spec</text>
  <text x="285" y="108" fill="#6b7280" font-size="8" font-family="Arial">• 316L Stainless</text>
  <text x="285" y="120" fill="#6b7280" font-size="8" font-family="Arial">• 15mm Thickness</text>
  <text x="285" y="132" fill="#6b7280" font-size="8" font-family="Arial">• Mirror Finish</text>
  
  <!-- Load Rating Box -->
  <rect x="280" y="150" width="100" height="45" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="330" y="165" text-anchor="middle" fill="#374151" font-size="10" font-weight="bold" font-family="Arial">Load Rating</text>
  <text x="285" y="178" fill="#6b7280" font-size="8" font-family="Arial">• 500kg Static</text>
  <text x="285" y="190" fill="#6b7280" font-size="8" font-family="Arial">• 200kg Dynamic</text>
  
  <!-- Hole Pattern Details -->
  <text x="20" y="220" fill="#374151" font-size="11" font-weight="bold" font-family="Arial">Hole Pattern Details:</text>
  <text x="20" y="235" fill="#6b7280" font-size="9" font-family="Arial">• Vertical Holes: Ø8mm, 30mm centers</text>
  <text x="20" y="248" fill="#6b7280" font-size="9" font-family="Arial">• Horizontal Holes: Ø8mm, 30mm centers</text>
  <text x="20" y="261" fill="#6b7280" font-size="9" font-family="Arial">• All holes countersunk for M8 socket head cap screws</text>
  <text x="20" y="274" fill="#6b7280" font-size="9" font-family="Arial">• Edge distance: 15mm minimum on all sides</text>
  <text x="20" y="287" fill="#6b7280" font-size="9" font-family="Arial">• Surface finish: 32 RMS maximum</text>
</svg>