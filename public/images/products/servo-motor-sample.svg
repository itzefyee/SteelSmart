<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Servo Motor Realistic Representation -->
  <defs>
    <linearGradient id="motorBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Motor Body -->
  <rect x="80" y="100" width="200" height="120" rx="8" fill="url(#motorBody)" stroke="#374151" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Mounting Holes -->
  <circle cx="100" cy="120" r="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <circle cx="260" cy="120" r="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <circle cx="100" cy="200" r="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <circle cx="260" cy="200" r="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  
  <!-- Motor Shaft -->
  <rect x="280" y="145" width="60" height="30" rx="15" fill="url(#shaft)" stroke="#374151" stroke-width="2"/>
  <circle cx="340" cy="160" r="8" fill="#6b7280" stroke="#374151" stroke-width="1"/>
  
  <!-- Status LEDs -->
  <circle cx="100" cy="140" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="100" cy="155" r="4" fill="#22c55e" opacity="0.8"/>
  <circle cx="100" cy="170" r="4" fill="#3b82f6" opacity="0.8"/>
  
  <!-- Connector -->
  <rect x="90" y="220" width="30" height="15" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  
  <!-- Label Plate -->
  <rect x="130" y="140" width="100" height="40" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="180" y="155" text-anchor="middle" fill="#374151" font-size="10" font-family="Arial">50Nm SERVO</text>
  <text x="180" y="168" text-anchor="middle" fill="#6b7280" font-size="8" font-family="Arial">3000 RPM</text>
  
  <!-- Model Number -->
  <text x="200" y="90" text-anchor="middle" fill="#374151" font-size="14" font-weight="bold" font-family="Arial">SGM-50N Series</text>
  
  <!-- Specifications -->
  <text x="50" y="260" fill="#6b7280" font-size="10" font-family="Arial">• High Torque: 50Nm continuous</text>
  <text x="50" y="275" fill="#6b7280" font-size="10" font-family="Arial">• Speed: 3000 RPM rated</text>
  <text x="50" y="290" fill="#6b7280" font-size="10" font-family="Arial">• Encoder: 20-bit absolute</text>
</svg>