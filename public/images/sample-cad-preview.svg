<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sample CAD Drawing Preview -->
  <rect width="300" height="200" fill="#f8fafc"/>
  
  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="300" height="200" fill="url(#grid)"/>
  
  <!-- Main component outline -->
  <rect x="50" y="60" width="200" height="80" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="150" cy="100" r="25" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="150" cy="100" r="15" fill="none" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Dimension lines -->
  <line x1="50" y1="45" x2="250" y2="45" stroke="#ef4444" stroke-width="1"/>
  <line x1="50" y1="40" x2="50" y2="50" stroke="#ef4444" stroke-width="1"/>
  <line x1="250" y1="40" x2="250" y2="50" stroke="#ef4444" stroke-width="1"/>
  <text x="150" y="35" text-anchor="middle" font-size="12" fill="#1e293b">200mm</text>
  
  <line x1="35" y1="60" x2="35" y2="140" stroke="#ef4444" stroke-width="1"/>
  <line x1="30" y1="60" x2="40" y2="60" stroke="#ef4444" stroke-width="1"/>
  <line x1="30" y1="140" x2="40" y2="140" stroke="#ef4444" stroke-width="1"/>
  <text x="25" y="105" text-anchor="middle" font-size="12" fill="#1e293b" transform="rotate(-90 25 105)">80mm</text>
  
  <!-- Mounting holes -->
  <circle cx="70" cy="80" r="3" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="230" cy="80" r="3" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="70" cy="120" r="3" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="230" cy="120" r="3" fill="none" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Title block -->
  <rect x="20" y="160" width="100" height="30" fill="none" stroke="#1e293b" stroke-width="1"/>
  <text x="25" y="175" font-size="10" fill="#1e293b">SERVO MOTOR</text>
  <text x="25" y="185" font-size="8" fill="#64748b">50Nm Torque</text>
</svg>